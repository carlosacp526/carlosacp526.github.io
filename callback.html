<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poketubi · TikTok authorization</title>
<style>
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0f0b1e;color:#ede9f6;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
  main{max-width:560px;margin:24px;padding:28px;background:#1d1535;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  h1{margin:0 0 6px;font-size:22px} p{line-height:1.5;color:#cfc8e6}
  code{display:block;word-break:break-all;background:#0f0b1e;border:1px solid #3a2d63;border-radius:8px;padding:12px;margin:12px 0;color:#fff}
  button{background:#fe2c55;color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer}
  .ok{color:#7ee0a0} .err{color:#ff8a8a} small{color:#9a90bd}
</style>
</head>
<body>
<main>
  <h1>Poketubi · TikTok authorization</h1>
  <div id="contenido"><p>Loading…</p></div>
  <p><small>This page only displays the authorization result returned by TikTok. It stores nothing and sends nothing anywhere.
  <a href="/" style="color:#b9a8ff">Back to the Poketubi site</a> · <a href="/privacy.html" style="color:#b9a8ff">Privacy</a> ·
  <a href="/terms.html" style="color:#b9a8ff">Terms</a></small></p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var c = document.getElementById("contenido");
  var code = q.get("code"), err = q.get("error");
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  if (code) {
    c.innerHTML = '<p class="ok"><b>Authorization received.</b> The TikTok account was connected successfully.</p>' +
      '<p>Go back to the Poketubi "Post to TikTok" screen, paste the full address of this page (or the code below) and click ' +
      '<b>Finish connection</b>.</p><code id="cod">' + esc(code) + '</code>' +
      '<button id="copiar">Copy code</button>';
    document.getElementById("copiar").onclick = function () {
      navigator.clipboard.writeText(code).then(function () { document.getElementById("copiar").textContent = "Copied ✓"; });
    };
  } else if (err) {
    c.innerHTML = '<p class="err"><b>Authorization was not completed.</b></p><p>' + esc(q.get("error_description") || err) +
      '</p><p>You can close this page and try again from the app.</p>';
  } else {
    c.innerHTML = '<p>This is the redirect page used after signing in with TikTok. Start from the Poketubi "Post to TikTok" screen.</p>';
  }
</script>
</body>
</html>
